server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires off; }
  location = /index.html { add_header Cache-Control "no-cache"; expires off; }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
